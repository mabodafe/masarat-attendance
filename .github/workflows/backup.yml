name: nightly-backup

# MANDATORY, NOT OPTIONAL.
#
# The Supabase Free plan includes NO automatic backups and NO point-in-time recovery.
# This database holds the hours that wages are paid from. Without this workflow there
# is no recovery path at all.
#
# Runs at 22:15 UTC = 01:15 Asia/Riyadh, after the working day.
#
# Required repository secret:
#   SUPABASE_DB_URL   the pooler connection string from
#                     Supabase -> Project Settings -> Database -> Connection string (URI)
#
# The dump is stored as a GitHub Actions artifact with 90-day retention. Artifacts on a
# PRIVATE repository are private. Download one to your own machine periodically as well:
# a backup that lives only in the same account as the data is one compromise from gone.

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # pg_dump refuses to dump from a NEWER server than itself (a deliberate safety
      # check), and Supabase's managed Postgres has moved ahead of 16 since this
      # workflow was written (confirmed live: server 17.6). Install client 17 to
      # stay at or ahead of the server; pg_dump/pg_restore are forward-compatible
      # with older server major versions, so this does not need to track exactly.
      - name: Install postgresql-client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # The ubuntu-latest runner ships its own older pg_dump earlier on PATH
          # (that's the 16.14 binary that kept getting picked instead of the one
          # just installed). Prepend the v17 bin dir so it wins for every later
          # step in this job, not just this one.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump the database
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> $GITHUB_ENV
          pg_dump --no-owner --no-privileges --format=custom \
                  --file="masarat-$STAMP.dump" "$PGURL"
          ls -la "masarat-$STAMP.dump"

      - name: Verify the dump is real before trusting it
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # A dump that restores to an empty database is the failure mode that hides
          # for months. Assert the tables are present and the staff rows are there.
          pg_restore --list "masarat-${STAMP}.dump" > toc.txt
          for t in users attendance schedules shifts projects punch_log leave_requests; do
            grep -q "TABLE DATA public $t" toc.txt || { echo "::error::$t missing from the dump"; exit 1; }
          done
          USERS=$(psql "$PGURL" -tAc 'select count(*) from users')
          echo "live user rows: $USERS"
          test "$USERS" -gt 0 || { echo "::error::database reports 0 users"; exit 1; }
          echo "dump verified: contains all seven core tables, database has $USERS users"

      - uses: actions/upload-artifact@v4
        with:
          name: masarat-db-${{ env.STAMP }}
          path: masarat-*.dump
          retention-days: 90

      # A job that silently stops running is the most dangerous backup failure.
      # A failed run marks the workflow red and emails the repository owner.
      - name: Report
        run: echo "backup ${STAMP} completed and verified"
