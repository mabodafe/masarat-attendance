name: deploy

# Deploys the API to Supabase Edge Functions and applies database migrations.
#
# CREDENTIAL BOUNDARY: the Supabase access token and database password live ONLY in
# this repository's GitHub Secrets. You set them yourself in the GitHub UI; they are
# never pasted into a chat, a file, or a log.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   Supabase account -> Access Tokens -> generate
#   SUPABASE_PROJECT_REF    the project ref, e.g. abcdefghijkl
#   SUPABASE_DB_PASSWORD    the database password you chose when creating the project
#
# The gate: this workflow runs the 131-check suite (plus the dedicated
# multi-session and photo-cleanup suites) against a throwaway Postgres and
# REFUSES TO DEPLOY if a single check fails.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Rapid-fire pushes (several commits within a minute or two) used to start several
# `deploy` runs at once, all racing to link/push/deploy the SAME Supabase project at
# the same time. That produced a real failure mode: one run's smoke test could hit
# the function mid-swap from another run and see a transient 404, even though nothing
# was actually wrong. This groups all runs on the same ref onto one lane — a new push
# cancels whatever's still in-flight for that ref, so only the latest commit's deploy
# ever completes, and no two deploys can trample each other. `cancel-in-progress` is
# safe here because a superseded run's deploy is, by definition, not the code we
# want live anyway.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 131-check acceptance suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: masarat
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: masarat_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        run: deno check api/index.ts scripts/seed.ts scripts/import-masarat.ts test/run.ts

      - name: Data layer checks
        run: deno run -A test/db_layer_test.ts
        env:
          DATABASE_URL: postgres://masarat:ci-local-only@localhost:5432/masarat_ci
          JWT_SECRET: ci-only-secret-with-enough-variety-Xq7Zk29Lm4
      - name: Auth slice checks
        run: deno run -A test/auth_slice_test.ts
        env:
          DATABASE_URL: postgres://masarat:ci-local-only@localhost:5432/masarat_ci
          JWT_SECRET: ci-only-secret-with-enough-variety-Xq7Zk29Lm4

      - name: Open-attendance policy checks
        run: deno run -A test/open_attendance_policy_test.ts
        env:
          DATABASE_URL: postgres://masarat:ci-local-only@localhost:5432/masarat_ci
          JWT_SECRET: ci-only-secret-with-enough-variety-Xq7Zk29Lm4
          ALLOW_OUT_OF_FENCE_WITH_FLAG: 'true'

      - name: THE GATE — 131 end-to-end checks
        run: deno run -A test/run.ts
        env:
          DATABASE_URL: postgres://masarat:ci-local-only@localhost:5432/masarat_ci
          JWT_SECRET: ci-only-secret-with-enough-variety-Xq7Zk29Lm4

      - name: Multi-session check-in/out checks
        run: deno run -A test/multi_session_test.ts
        env:
          DATABASE_URL: postgres://masarat:ci-local-only@localhost:5432/masarat_ci
          JWT_SECRET: ci-only-secret-with-enough-variety-Xq7Zk29Lm4

      - name: 60-day selfie cleanup and backup checks
        run: deno run -A test/photo_cleanup_test.ts
        env:
          DATABASE_URL: postgres://masarat:ci-local-only@localhost:5432/masarat_ci
          JWT_SECRET: ci-only-secret-with-enough-variety-Xq7Zk29Lm4

      - name: Assert the suite did not write into a live photo directory
        run: |
          for d in data/photos .local-photos; do
            if [ -d "$d" ]; then echo "::error::the suite wrote into $d"; ls -la "$d"; exit 1; fi
          done
          echo "no live-data pollution"

  deploy:
    name: Deploy to Supabase
    needs: test          # <- the gate. No green suite, no deploy.
    # Belt-and-suspenders alongside the `on.push.branches: [main]` trigger above:
    # workflow_dispatch (manually running this workflow from the Actions tab, e.g. to
    # test a dev branch) has no branch restriction of its own, so without this guard a
    # manual run from any branch would still deploy that branch's code to production.
    # This makes "run the workflow on a dev branch to check the test job" safe by
    # construction — deploy simply never executes unless the ref is main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # --no-verify-jwt is REQUIRED: our tokens are this app's own HS256 JWTs, not
      # Supabase JWTs. The app still enforces requireAuth + requireRole on every route.
      - name: Deploy the api function
        run: supabase functions deploy api --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # We used to curl the Supabase function directly
      # (https://<ref>.supabase.co/functions/v1/api/api/health). That consistently came
      # back 404 "Unknown endpoint" — our own app's catch-all, meaning the request DID
      # reach the function but didn't resolve to a route — for six retries over 30s,
      # in run after run, even though the exact same endpoint reachable through
      # production (https://masarat-attendance.pages.dev/api/health, the one real users
      # and the frontend actually call) was healthy the whole time. That points to
      # something specific to invoking the function directly from a GitHub-hosted
      # runner (an edge POP / routing quirk on Supabase's side, not a real outage), so
      # testing that URL was never proving anything about production health — it was
      # testing a path nothing in this app actually uses.
      #
      # Test the real path instead: same origin, same Cloudflare Pages Function proxy,
      # same header handling that every employee's phone goes through. A short retry
      # still guards against a genuine brief propagation gap right after deploy.
      - name: Smoke test the deployed function
        run: |
          URL="https://masarat-attendance.pages.dev/api/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$URL")
            echo "attempt $attempt: health: $code"; cat /tmp/health.json; echo
            if [ "$code" = "200" ] && grep -q 'Asia/Riyadh' /tmp/health.json; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::production health check never came back healthy after 3 attempts"
          exit 1
